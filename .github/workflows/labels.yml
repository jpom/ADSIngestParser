name: Sync Github labels

on:
  push:
    branches:
      - main
    paths:
      - ".github/**"

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync labels with Github
        uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
